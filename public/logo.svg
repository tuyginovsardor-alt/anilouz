<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Asosiy ranglar gradyenti -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e33" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <!-- Metallik effekt uchun -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
    <!-- Nur taralishi (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orqa fon (Qora doira) -->
  <rect width="512" height="512" rx="128" fill="#050505"/>
  <circle cx="256" cy="256" r="230" stroke="white" stroke-opacity="0.05" stroke-width="2" />

  <!-- Tashqi halqa (Anime energiyasi) -->
  <path d="M256 90C164.32 90 90 164.32 90 256C90 347.68 164.32 422 256 422C347.68 422 422 347.68 422 256" 
        stroke="url(#mainGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#neonGlow)" />

  <!-- Ichki Spiral (Anilo ramzi - Uzumaki uslubi) -->
  <path d="M256 256C256 210 220 210 220 256C220 310 290 310 290 256C290 180 170 180 170 256C170 350 342 350 342 256C342 130 110 130 110 256C110 410 402 410 402 256C402 100 280 60 210 70" 
        stroke="white" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.95" />

  <!-- Markazdagi "A" harfi simvoli (Yashirin ko'rinishda) -->
  <path d="M240 220L256 185L272 220M230 280L256 240L282 280" 
        stroke="url(#mainGrad)" 
        stroke-width="8" 
        stroke-linecap="round" />
        
  <!-- Yorqinlik effekti -->
  <rect width="512" height="512" rx="128" fill="url(#metalGrad)" />
</svg>